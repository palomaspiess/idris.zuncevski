<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt | Idris Zuncevski</title>
  <meta
    name="description"
    content="Kontaktseite von Idris Zuncevski fuer technische Zusammenarbeit und Projektanfragen."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-lang="de">
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="de-index.html">Idris Zuncevski</a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">Menue</button>
      <nav id="site-nav" class="site-nav" aria-label="Hauptnavigation">
        <a href="de-index.html" data-nav="home">Start</a>
        <a href="de-about.html" data-nav="about">Ueber mich</a>
        <a href="de-technical.html" data-nav="technical">Technik</a>
        <a href="de-contact.html" data-nav="contact">Kontakt</a>
      </nav>
      <div class="lang-switch" aria-label="Sprachwechsel">
        <a href="contact.html">EN</a>
        <a href="de-contact.html" aria-current="true">DE</a>
      </div>
    </header>

    <main>
      <section class="hero hero-compact js-reveal" data-delay="0.06">
        <p class="eyebrow">Kontakt</p>
        <h1>Lassen Sie uns ueber Ihre technische Herausforderung sprechen.</h1>
        <p class="lead">
          Mit dem Formular unten koennen Sie direkt eine Anfrage senden. Auf GitHub Pages wird dazu Ihr
          E-Mail-Programm mit vorausgefuellter Nachricht geoeffnet.
        </p>
      </section>

      <section class="form-section js-reveal" data-delay="0.14">
        <form id="contact-form" class="contact-form" novalidate data-invalid-msg="Bitte alle Pflichtfelder ausfuellen." data-sent-msg="Ihr E-Mail-Programm wird mit vorbereiteter Nachricht geoeffnet.">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />

          <label for="email">E-Mail</label>
          <input id="email" name="email" type="email" required />

          <label for="topic">Thema</label>
          <input id="topic" name="topic" type="text" placeholder="Projekt, Zusammenarbeit, Beratung..." required />

          <label for="message">Nachricht</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button class="button button-primary" type="submit">Nachricht senden</button>
          <p id="form-status" class="form-status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> Idris Zuncevski</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
