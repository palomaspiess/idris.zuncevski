<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Idris Zuncevski</title>
  <meta
    name="description"
    content="Contact Idris Zuncevski for engineering collaboration, technical consulting, or project inquiries."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-lang="en">
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html">Idris Zuncevski</a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="site-nav" aria-label="Main navigation">
        <a href="index.html" data-nav="home">Home</a>
        <a href="about.html" data-nav="about">About</a>
        <a href="technical.html" data-nav="technical">Technical</a>
        <a href="contact.html" data-nav="contact">Contact</a>
      </nav>
      <div class="lang-switch" aria-label="Language switch">
        <a href="contact.html" aria-current="true">EN</a>
        <a href="de-contact.html">DE</a>
      </div>
    </header>

    <main>
      <section class="hero hero-compact js-reveal" data-delay="0.06">
        <p class="eyebrow">Contact</p>
        <h1>Let’s discuss your engineering challenge.</h1>
        <p class="lead">
          Use the form below to send an inquiry. On GitHub Pages this form opens your email client with
          the message prefilled.
        </p>
      </section>

      <section class="form-section js-reveal" data-delay="0.14">
        <form id="contact-form" class="contact-form" novalidate data-invalid-msg="Please complete all required fields." data-sent-msg="Opening your email app with the prepared message.">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="topic">Topic</label>
          <input id="topic" name="topic" type="text" placeholder="Project, collaboration, consulting..." required />

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button class="button button-primary" type="submit">Send Message</button>
          <p id="form-status" class="form-status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> Idris Zuncevski</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
